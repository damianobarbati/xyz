name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --no-progress --frozen-lockfile --prefer-offline --loglevel warn
          pnpm -F nfr exec playwright install --no-progress --with-deps chromium-headless-shell

      - name: Run lint
        run: |
          pnpm lint
          git diff --exit-code

      - name: Set up local environment
        run: |
          cp sample.env .env
          pnpm env:up
          pnpm -F api db:migrate
          pnpm -F api db:seed
          pnpm dev &
          timeout 60 sh -c 'until curl --output /dev/null --silent --fail http://localhost:8080/health; do printf .; sleep 1; done'
          timeout 60 sh -c 'until curl --output /dev/null --silent --fail http://localhost:3000; do printf .; sleep 1; done'

      - name: Run tests
        run: pnpm -r test

      - name: Run E2E tests
        run: pnpm -F nfr test:e2e

  build:
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/api/Dockerfile
          load: true
          push: false
          tags: xyz-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/web/Dockerfile
          load: true
          push: false
          tags: xyz-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Check images
        run: |
          cp sample.env .env
          docker compose up -d --wait --quiet-pull
          sed -E 's/localhost/host.docker.internal/g' .env > docker.env
          docker run -d --name xyz-api --add-host=host.docker.internal:host-gateway -p 8080:8080 --env-file docker.env xyz-api
          docker run -d --name xyz-web --add-host=host.docker.internal:host-gateway -p 3000:3000 --env-file docker.env -e API_URL=http://xyz-api:8080 xyz-web
          sleep 3
          curl --max-time 1 --fail --silent --show-error --output /dev/null http://localhost:8080 
          curl --max-time 1 --fail --silent --show-error --output /dev/null http://localhost:3000
