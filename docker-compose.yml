services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: xyz
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d xyz"]
      start_period: 1s
      interval: 1s
      timeout: 1s
      retries: 3

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--user",
        "default",
        "off",
        "--user",
        "user",
        "on",
        ">password",
        "~*",
        "+@all",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory-policy",
        "noeviction",
        "--loglevel",
        "warning",
      ]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user user -a password ping"]
      start_period: 2s
      interval: 1s
      timeout: 1s
      retries: 5
